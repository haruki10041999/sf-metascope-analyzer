# 型チェック・整形の確認・テスト・ビルド・依存の監査 (docs/plan.md 10 章 P0)
name: CI

on:
    push:
        branches: [main, 'v*']
    pull_request:
    workflow_dispatch:

jobs:
    check:
        name: check (${{ matrix.os }}, Node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # 手元の開発は Windows。Linux でも動くことを確かめる
                os: [windows-latest, ubuntu-latest]
                # engines の下限 (24.15 以上。node:sqlite を使う) と、手元の開発の版 (.nvmrc)
                node: [24, 26]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install
              run: npm ci --no-audit --no-fund

            # 本番の依存 (dependencies) に high 以上の脆弱性があれば止める
            - name: Audit
              run: npm audit --omit=dev --audit-level=high

            - name: Typecheck (src・テスト・サンプルのスクリプト)
              run: npm run typecheck

            - name: Format check
              run: npm run format:check

            - name: Test
              run: npm test

            - name: Build (tsc・レポートの viewer・ビルド版)
              run: npm run build
