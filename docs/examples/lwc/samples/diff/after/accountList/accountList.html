<template>
    <lightning-card title={title} icon-name="standard:account">
        <lightning-button slot="actions" label="再読み込み" variant="brand" onclick={refresh}></lightning-button>
        <lightning-button slot="actions" label="保存" onclick={handleSave}></lightning-button>
        <template lwc:if={parentName}>
            <p class="parent">{parentName}</p>
        </template>
        <template lwc:if={hasRows}>
            <template lwc:if={isTable}>
                <table class="slds-table" lwc:ref="table">
                    <tbody>
                        <template for:each={rows} for:item="row" for:index="index">
                            <tr key={row.id}>
                                <td>
                                    <c-account-row
                                        record-id={row.id}
                                        name={row.name}
                                        amount={row.amount}
                                        onselect={handleSelect}
                                    ></c-account-row>
                                </td>
                                <td><button data-id={row.id} onclick={handleDelete}>削除</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template lwc:else>
                <template iterator:it={rows}>
                    <div key={it.value.id} class="tile">
                        <span lwc:if={it.first}>先頭: </span>{it.value.name}
                    </div>
                </template>
            </template>
            <p class="total">合計: {totalAmount}</p>
        </template>
        <template lwc:elseif={error}>
            <c-error-panel errors={error}></c-error-panel>
        </template>
        <template lwc:else>
            <p class="empty">該当する取引先がありません</p>
        </template>
        <slot name="footer"></slot>
    </lightning-card>
</template>
